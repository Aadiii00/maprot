# ==============================================================================
# MapRot: Geospatial Surface Analytics & Semantic Segmentation Framework
# Default Configuration Profile
# ==============================================================================

project_name: "MapRot"
device: "cpu"  # Set to "cuda" if NVIDIA GPU with PyTorch CUDA is available
log_level: "INFO"

dirs:
  data_dir: "data"
  train_dir: "data/train"
  test_dir: "data/test"
  weights_dir: "weights"
  outputs_dir: "outputs"
  logs_dir: "logs"

data:
  file_type: ".tif"
  patch_size: 512
  discard_rate: 0.95
  batch_size: 16
  num_workers: 0

classes:
  all_classes:
    - "background"
    - "building"
    - "woodland"
    - "water"
    - "road"
  train_classes:
    - "background"
    - "building"
    - "woodland"
    - "water"
  inference_classes:
    - "background"
    - "building"
    - "water"

model:
  arch: "Unet"
  encoder: "efficientnet-b0"
  encoder_weights: "imagenet"
  activation: "softmax2d"
  checkpoint_name: "maprot_unet_efficientnet_b0.pth"

training:
  epochs: 20
  optimizer: "Adam"
  init_lr: 0.0003
  lr_reduce_factor: 0.5
  lr_patience: 5
  lr_min: 0.000001
